# docker-compose.yml
version: '3.8'

services:
  engine:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data  # Maps the local 'data' folder to the container

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - engine
    restart: unless-stopped